<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exoesqueleto Pediátrico 3D</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><aside class="panel"><h1>EXO Pediátrico</h1><p class="sub">ESP32 · Telemetría biomédica · Modelo 3D</p><div class="status"><span id="dot"></span><b id="conn">Desconectado</b><small id="mode">IDLE</small></div><section><h2>Movimiento</h2><button id="start">Sit-to-Stand + Secuencia</button><button id="stop" class="danger">STOP</button><div class="grid"><label>Rot X<input id="rx" type="range" min="-180" max="180" value="0"></label><label>Rot Y<input id="ry" type="range" min="-180" max="180" value="0"></label><label>Rot Z<input id="rz" type="range" min="-180" max="180" value="0"></label></div><label class="check"><input id="wheelRotate" type="checkbox" checked> Rueda del mouse rota Z</label></section><section><h2>Biomédicos</h2><div class="cards"><div><b id="bpm">--</b><span>BPM</span></div><div><b id="spo2">--</b><span>SpO₂ %</span></div><div><b id="body">--</b><span>Cuerpo °C</span></div><div><b id="amb">--</b><span>Ambiente °C</span></div><div><b id="cpu">--</b><span>CPU °C</span></div><div><b id="emg">--</b><span>EMG</span></div><div><b id="ecg">--</b><span>ECG</span></div></div></section><section><h2>Articulaciones</h2><pre id="joints">--</pre></section></aside><section class="viewport"><div id="scene"></div><div class="hint">Arrastrar: orbitar · Scroll: zoom o rotación Z · Shift+scroll: rotación Y · Alt+scroll: rotación X</div></section></main><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script><script src="app.js"></script></body></html>
