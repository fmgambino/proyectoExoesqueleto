<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Exoesqueleto Pediatrico - Telemetria</title><style>body{margin:0;font-family:system-ui;background:#10131a;color:#e8edf7}.bar{padding:12px;display:flex;gap:8px;align-items:center;background:#171b25;position:fixed;inset:0 0 auto 0;z-index:2}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.start{background:#36c275}.stop{background:#ff5c5c}.muted{background:#2c3446;color:#e8edf7}#hud{margin-left:auto;font-size:14px;opacity:.9}#view{width:100vw;height:100vh;display:block}.panel{position:fixed;left:12px;bottom:12px;background:rgba(23,27,37,.86);border:1px solid #2d3445;border-radius:14px;padding:12px;min-width:270px}.row{display:flex;justify-content:space-between;gap:20px;margin:4px 0}.fault{color:#ff7777}</style></head><body><div class="bar"><button class="start" onclick="cmd('START')">START secuencia</button><button class="stop" onclick="cmd('STOP')">STOP</button><button class="muted" onclick="cmd('RESET')">RESET sentado</button><button class="muted" onclick="cmd('STAND')">De pie</button><button class="muted" onclick="cmd('SIT')">Sentado</button><div id="hud">Conectando...</div></div><canvas id="view"></canvas><div class="panel" id="data"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="app.js"></script></body></html>
