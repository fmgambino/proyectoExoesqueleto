<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Control</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/data/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



</head>
<body>
    <header>
        <img id="logo" src="https://www3.gobiernodecanarias.org/medusa/ecoescuela/elobservatorio/files/2011/10/BerkeleyBionicsLogo.png" alt="Logo">
        
        <div id="header-controls">
            <label class="switch" id="ap-reset">
                <input type="checkbox" id="ap-toggle">
                <span class="slider"></span>
            </label>
            
            
            <label class="switch">
                <input type="checkbox" id="mode-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </header>
    <h1>Control de Motor Nema 17</h1>
    <main>
        <button id="turnLeft">Girar Izquierda</button>
        <button id="turnRight">Girar Derecha</button>
    </main>

    <footer>2024 &copy; EXOLETO Medical All rights reserved - Developed by <a href='https://electronicagambino.com' style='color: #ccc; text-decoration: none;'>Electrónica Gambino</a></footer>

    <script src="/script.js"></script>
    <script src="/data/script.js"></script>    
    <script src="/data/resetAP.js"></script>
    <script src="/resetAP.js"></script>

</body>
</html>
