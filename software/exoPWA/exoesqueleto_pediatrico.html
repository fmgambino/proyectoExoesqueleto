<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modelo 3D Exoesqueleto Pediátrico NEMA17</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="panel">
      <h1>Exoesqueleto pediátrico 3D</h1>
      <p>Modelo procedural inspirado en las fotos: estructura bilateral, 4 motores NEMA17, perfiles negros, piezas grises impresas y base superior tipo carrito.</p>
      <div class="controls">
        <button id="toggleAnim">Pausar marcha</button>
        <button id="resetCam">Reset cámara</button>
        <label>Velocidad <input id="speed" type="range" min="0" max="2" step="0.01" value="0.85"></label>
      </div>
      <small>NEMA17: 1,2°/paso → 300 pasos/vuelta.</small>
    </header>
    <canvas id="scene"></canvas>
  </div>

  <!-- CDN: Three.js + OrbitControls + GSAP para animación tipo After Effects -->
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
