<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exoesqueleto Pediátrico 3D | Viewer profesional</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <aside class="hud glass">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>Exo Pediátrico 3D</h1>
          <p>NEMA17 · ESP32 · WebSocket Ready</p>
        </div>
      </div>

      <section class="card">
        <h2>Vista</h2>
        <div class="grid2">
          <button id="btnReset" class="btn primary">Reset cámara</button>
          <button id="btnFit" class="btn">Centrar modelo</button>
        </div>
        <label>Rotación modelo eje Z
          <input id="rotZ" type="range" min="-180" max="180" value="0" step="1" />
          <output id="rotZOut">0°</output>
        </label>
        <label>Zoom
          <input id="zoom" type="range" min="35" max="95" value="55" step="1" />
          <output id="zoomOut">55°</output>
        </label>
      </section>

      <section class="card">
        <h2>Animación</h2>
        <div class="grid2">
          <button id="btnWalk" class="btn primary">Marcha ON</button>
          <button id="btnSitStand" class="btn">Sentar/parar</button>
        </div>
        <label>Velocidad
          <input id="speed" type="range" min="0" max="2" step="0.01" value="0.85" />
          <output id="speedOut">0.85x</output>
        </label>
      </section>

      <section class="card status">
        <h2>Telemetría</h2>
        <p><b>WS:</b> <span id="wsState">offline demo</span></p>
        <p><b>NEMA17:</b> 1,2°/paso · 300 pasos/vuelta</p>
        <p><b>Controles:</b> arrastrar = órbita 360°, rueda = zoom, clic derecho = paneo.</p>
      </section>
    </aside>

    <section class="viewport">
      <canvas id="scene"></canvas>
      <div class="badge">Ejes XYZ activos · giro Z habilitado</div>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
